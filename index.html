<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BST Calendar</title>
<meta name="description" content="BS Technology team calendar">
<meta name="theme-color" content="#0B79BF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BST Calendar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html, body { margin: 0; height: 100%; background: #F3F5F7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #2B343D; }
body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box; }
#app { display: block; width: 100%; height: 100%; border: 0; }
.cover { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #F3F5F7; text-align: center; padding: 24px; box-sizing: border-box; }
.cover img { width: 96px; height: 96px; }
.cover p { margin: 0; font-size: 16px; }
.cover button { height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #0B79BF; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
.hide { display: none; }
</style>
</head>
<body>
<iframe id="app" title="BST Calendar" src="https://script.google.com/macros/s/AKfycbwTXS6EC25_4b6-gLpOKe2ZyXU3j35tjhwEMQfhw8ei1tM4GCEcuCxsTCjOWncAHVDw/exec" allow="clipboard-write"></iframe>
<div id="splash" class="cover" role="status"><img src="icons/icon-192.png" alt=""><p>Loading calendar…</p></div>
<div id="offline" class="cover hide" role="alert"><img src="icons/icon-192.png" alt=""><p>You're offline. Connect to the internet to open the calendar.</p><button type="button" id="retry">Try again</button></div>
<script>
(function () {
  var app = document.getElementById('app'), splash = document.getElementById('splash'), off = document.getElementById('offline');
  var src = app.getAttribute('src');
  function show(el, on) { el.classList.toggle('hide', !on); }
  app.addEventListener('load', function () { setTimeout(function () { show(splash, false); }, 400); });
  setTimeout(function () { show(splash, false); }, 15000);
  function check() { if (!navigator.onLine) { show(splash, false); show(off, true); } }
  window.addEventListener('offline', check);
  window.addEventListener('online', function () { show(off, false); });
  document.getElementById('retry').addEventListener('click', function () {
    if (!navigator.onLine) return;
    show(off, false); show(splash, true); app.src = src;
  });
  check();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
